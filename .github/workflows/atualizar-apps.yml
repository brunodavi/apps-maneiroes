name: Atualizar apps

on:
  schedule:
    - cron: "0 16 5 * *"   # dia 5 de cada mês, ~13h BRT
  workflow_dispatch:        # permite rodar manualmente pela aba Actions
  push:
    branches: [master]        # publicação de ajustes no site/data

permissions:
  contents: write           # o bot precisa commitar os caches
  pages: write              # e publicar no Pages
  id-token: write

concurrency:
  group: atualizar-apps
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Testes JavaScript
        run: node --test site/js/utils.test.js

      - name: Testes Python
        run: python test/test_gerar.py -q

      # GITHUB_TOKEN (auto-injetado) sobe o limite da API de 60/h p/ 1000/h
      # e habilita o GraphQL em lote. --janela 3: só procura vídeos de série
      # publicados nos últimos 3 meses (o restante já está no cache commitado).
      - name: Gerar apps.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python src/gerar.py --janela 3

      - name: Commit (só se mudou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza data/apps.json ($(date -u +%m/%Y))"
            git push
          fi

  # publica site/ no GitHub Pages (Source = GitHub Actions)
  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4     # apps.json recém-commitado no passo acima
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "site"
      - id: deployment
        uses: actions/deploy-pages@v4
